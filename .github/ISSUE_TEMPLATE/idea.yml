name: Idea or feature request
description: Something Seamdesk could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Machines, monitors and what runs on them, roughly.
